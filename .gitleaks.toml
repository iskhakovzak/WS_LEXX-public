# gitleaks: default rules + an allowlist for local/CI test database URLs only.
# Never allowlist a real token, password or key here — rotate it instead (ARCHITECTURE.md §6).
title = "WS_LEXX"

[extend]
useDefault = true

[[allowlists]]
description = "Local and CI test Postgres DSNs (postgres:postgres on localhost)"
regexTarget = "match"
regexes = [
  '''postgres(ql)?://postgres:postgres@(localhost|127\.0\.0\.1)(:\d+)?(/[A-Za-z0-9_]*)?''',
]

[[allowlists]]
description = "Browser storage key names (localStorage / sessionStorage), e.g. PREFS_KEY = \"ws_lexx_disc_prefs_v1\" — names, not secrets"
regexTarget = "line"
regexes = [
  '''[A-Z][A-Z0-9_]*_KEY\s*=\s*["'][a-z][a-z0-9_.:-]*["']\s*;?\s*(//.*)?$''',
]
