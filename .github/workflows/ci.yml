name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: # manual re-run from the Actions tab (a run that failed to start cannot be retried)

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          # test-setup.ts refuses any database whose name does not end in _test (never the dev DB edge_tracker)
          POSTGRES_DB: edge_tracker_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/edge_tracker_test
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # biome --changed compares with origin/main
      - uses: pnpm/action-setup@v4 # version comes from "packageManager" in package.json
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: lint (Biome on changed files + ESLint warnings)
        run: pnpm run lint:ci
      - name: typecheck (libs, apps, scripts, tests)
        run: pnpm run typecheck
      - name: test
        run: pnpm run test
      - name: ratchets (i18n, ru-RU, http errors, sizes, lint counts, layers, z-index, permissions)
        run: pnpm run checks
      - name: build
        run: pnpm run build:packages
      - name: audit (runtime dependencies, high/critical)
        run: pnpm audit --prod --audit-level high
        continue-on-error: true

  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml
