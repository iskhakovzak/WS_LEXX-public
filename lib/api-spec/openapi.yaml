openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Prop Trading Desk API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: trades
    description: Trade journal entries
  - name: events
    description: Market events and catalysts
  - name: research
    description: Edge research and patterns
  - name: dailyfeed
    description: Daily regime feed
  - name: discussions
    description: Team discussion threads
  - name: dashboard
    description: Dashboard analytics
  - name: big7levels
    description: Big 7 key technical levels
  - name: big7tickers
    description: Big 7 / Hot Stocks watchlist tickers
  - name: warroom
    description: War Room sessions for high-volatility events
  - name: psychology
    description: Trader psychology tracking and analytics
  - name: dailyquote
    description: Daily multilingual trading + psychology quotes

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  # ── TRADES ────────────────────────────────────────────────────────────────
  /trades:
    get:
      operationId: listTrades
      tags: [trades]
      summary: List all trades
      parameters:
        - name: setup
          in: query
          schema:
            type: ["string", "null"]
        - name: eventType
          in: query
          schema:
            type: ["string", "null"]
        - name: session
          in: query
          schema:
            type: ["string", "null"]
        - name: trader
          in: query
          schema:
            type: ["string", "null"]
        - name: result
          in: query
          schema:
            type: ["string", "null"]
      responses:
        "200":
          description: List of trades
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Trade"
    post:
      operationId: createTrade
      tags: [trades]
      summary: Create a trade
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTradeBody"
      responses:
        "201":
          description: Created trade
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Trade"

  /trades/{id}:
    get:
      operationId: getTrade
      tags: [trades]
      summary: Get a trade by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Trade
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Trade"
        "404":
          description: Not found
    patch:
      operationId: updateTrade
      tags: [trades]
      summary: Update a trade
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateTradeBody"
      responses:
        "200":
          description: Updated trade
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Trade"
    delete:
      operationId: deleteTrade
      tags: [trades]
      summary: Delete a trade
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  # ── EVENTS ────────────────────────────────────────────────────────────────
  /events:
    get:
      operationId: listEvents
      tags: [events]
      summary: List market events
      parameters:
        - name: ticker
          in: query
          schema:
            type: ["string", "null"]
        - name: eventType
          in: query
          schema:
            type: ["string", "null"]
      responses:
        "200":
          description: List of events
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MarketEvent"
    post:
      operationId: createEvent
      tags: [events]
      summary: Create a market event
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateEventBody"
      responses:
        "201":
          description: Created event
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MarketEvent"

  /events/{id}:
    get:
      operationId: getEvent
      tags: [events]
      summary: Get an event by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Event
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MarketEvent"
        "404":
          description: Not found
    patch:
      operationId: updateEvent
      tags: [events]
      summary: Update an event
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateEventBody"
      responses:
        "200":
          description: Updated event
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MarketEvent"
    delete:
      operationId: deleteEvent
      tags: [events]
      summary: Delete an event
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  # ── RESEARCH ────────────────────────────────────────────────────────────
  /research:
    get:
      operationId: listResearch
      tags: [research]
      summary: List research entries
      responses:
        "200":
          description: List of research entries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Research"
    post:
      operationId: createResearch
      tags: [research]
      summary: Create a research entry
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateResearchBody"
      responses:
        "201":
          description: Created research
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Research"

  /research/{id}:
    get:
      operationId: getResearch
      tags: [research]
      summary: Get research by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Research entry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Research"
        "404":
          description: Not found
    patch:
      operationId: updateResearch
      tags: [research]
      summary: Update a research entry
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateResearchBody"
      responses:
        "200":
          description: Updated research
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Research"
    delete:
      operationId: deleteResearch
      tags: [research]
      summary: Delete a research entry
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  # ── DAILY FEED ────────────────────────────────────────────────────────────
  /dailyfeed:
    get:
      operationId: listDailyFeed
      tags: [dailyfeed]
      summary: List daily feed entries
      responses:
        "200":
          description: List of daily feed entries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DailyFeed"
    post:
      operationId: createDailyFeed
      tags: [dailyfeed]
      summary: Create a daily feed entry
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateDailyFeedBody"
      responses:
        "201":
          description: Created daily feed entry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DailyFeed"

  /dailyfeed/{id}:
    get:
      operationId: getDailyFeed
      tags: [dailyfeed]
      summary: Get daily feed entry by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Daily feed entry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DailyFeed"
        "404":
          description: Not found
    patch:
      operationId: updateDailyFeed
      tags: [dailyfeed]
      summary: Update daily feed entry
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateDailyFeedBody"
      responses:
        "200":
          description: Updated daily feed entry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DailyFeed"
    delete:
      operationId: deleteDailyFeed
      tags: [dailyfeed]
      summary: Delete daily feed entry
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  # ── DISCUSSIONS ─────────────────────────────────────────────────────────
  /discussions:
    get:
      operationId: listDiscussions
      tags: [discussions]
      summary: List discussions
      responses:
        "200":
          description: List of discussions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Discussion"
    post:
      operationId: createDiscussion
      tags: [discussions]
      summary: Create a discussion
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateDiscussionBody"
      responses:
        "201":
          description: Created discussion
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Discussion"

  /discussions/{id}:
    get:
      operationId: getDiscussion
      tags: [discussions]
      summary: Get discussion by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Discussion
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Discussion"
        "404":
          description: Not found
    delete:
      operationId: deleteDiscussion
      tags: [discussions]
      summary: Delete discussion
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /discussions/{id}/comments:
    post:
      operationId: addComment
      tags: [discussions]
      summary: Add comment to discussion
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCommentBody"
      responses:
        "201":
          description: Created comment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Comment"

  # ── DASHBOARD / ANALYTICS ─────────────────────────────────────────────
  /dashboard/summary:
    get:
      operationId: getDashboardSummary
      tags: [dashboard]
      summary: Get dashboard summary metrics
      responses:
        "200":
          description: Dashboard summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummary"

  /dashboard/performance:
    get:
      operationId: getPerformanceStats
      tags: [dashboard]
      summary: Get performance analytics per setup/trader/event
      responses:
        "200":
          description: Performance stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PerformanceStats"

  /dashboard/toppatterns:
    get:
      operationId: getTopPatterns
      tags: [dashboard]
      summary: Get top performing patterns
      responses:
        "200":
          description: Top patterns list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PatternStat"

  /dashboard/recenttrades:
    get:
      operationId: getRecentTrades
      tags: [dashboard]
      summary: Get recent trades for dashboard feed
      responses:
        "200":
          description: Recent trades
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Trade"

  # ── BIG 7 LEVELS ─────────────────────────────────────────────────────
  # ── WAR ROOM ──────────────────────────────────────────────────────────
  /warroom/active:
    get:
      operationId: getActiveWarRoom
      tags: [warroom]
      summary: Get active War Room session
      parameters:
        - name: trader
          in: query
          schema:
            type: ["string", "null"]
      responses:
        "200":
          description: Active session or null
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WarRoomSessionWithLevels"

  /warroom/sessions:
    get:
      operationId: listWarRoomSessions
      tags: [warroom]
      summary: List War Room sessions
      responses:
        "200":
          description: List of sessions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/WarRoomSession"
    post:
      operationId: createWarRoomSession
      tags: [warroom]
      summary: Create a War Room session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateWarRoomSessionBody"
      responses:
        "201":
          description: Created session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WarRoomSession"

  /warroom/sessions/{id}:
    patch:
      operationId: updateWarRoomSession
      tags: [warroom]
      summary: Update a War Room session
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateWarRoomSessionBody"
      responses:
        "200":
          description: Updated session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WarRoomSession"
        "404":
          description: Not found

  /warroom/sessions/{id}/levels:
    post:
      operationId: createWarRoomLevel
      tags: [warroom]
      summary: Add a level to a War Room session
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateWarRoomLevelBody"
      responses:
        "201":
          description: Created level
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WarRoomLevel"

  /warroom/levels/{id}:
    delete:
      operationId: deleteWarRoomLevel
      tags: [warroom]
      summary: Delete a War Room level
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  # ── BIG 7 LEVELS ─────────────────────────────────────────────────────
  /big7levels:
    get:
      operationId: listBig7Levels
      tags: [big7levels]
      summary: List all Big 7 key levels
      responses:
        "200":
          description: List of key levels
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Big7Level"
    post:
      operationId: createBig7Level
      tags: [big7levels]
      summary: Create a Big 7 key level
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateBig7LevelBody"
      responses:
        "201":
          description: Created key level
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Big7Level"

  /big7levels/{id}:
    patch:
      operationId: updateBig7Level
      tags: [big7levels]
      summary: Update a Big 7 key level
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateBig7LevelBody"
      responses:
        "200":
          description: Updated key level
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Big7Level"
        "404":
          description: Not found
    delete:
      operationId: deleteBig7Level
      tags: [big7levels]
      summary: Delete a Big 7 key level
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  # ── BIG 7 TICKERS (Core + Hot Stocks) ────────────────────────────────
  /big7/tickers:
    get:
      operationId: listBig7Tickers
      tags: [big7tickers]
      summary: List all Big 7 tickers (core + hot stocks)
      responses:
        "200":
          description: List of tickers
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Big7Ticker"
    post:
      operationId: createBig7Ticker
      tags: [big7tickers]
      summary: Add a single ticker to a group
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateBig7TickerBody"
      responses:
        "201":
          description: Created ticker
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Big7Ticker"

  /big7/tickers/bulk:
    post:
      operationId: bulkCreateBig7Tickers
      tags: [big7tickers]
      summary: Bulk add tickers to a group (paste-friendly)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BulkBig7TickersBody"
      responses:
        "201":
          description: Result of bulk add
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BulkBig7TickersResult"

  /big7/tickers/{id}:
    patch:
      operationId: updateBig7Ticker
      tags: [big7tickers]
      summary: Update a Big 7 ticker
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateBig7TickerBody"
      responses:
        "200":
          description: Updated ticker
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Big7Ticker"
        "404":
          description: Not found
    delete:
      operationId: deleteBig7Ticker
      tags: [big7tickers]
      summary: Delete a Big 7 ticker
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  # ── DAILY QUOTES ─────────────────────────────────────────────────────
  /daily-quote/today:
    get:
      operationId: getTodayDailyQuote
      tags: [dailyquote]
      summary: Get (or lazily generate) today's trilingual quote bundle
      responses:
        "200":
          description: Today's quote bundle
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DailyQuote"

  /daily-quote/regenerate:
    post:
      operationId: regenerateDailyQuote
      tags: [dailyquote]
      summary: Force regenerate today's quote (admin/curator)
      responses:
        "200":
          description: Regenerated quote bundle
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DailyQuote"
        "503":
          description: AI generation failed

  /daily-quote/recent:
    get:
      operationId: listRecentDailyQuotes
      tags: [dailyquote]
      summary: Last 14 days of quote bundles
      responses:
        "200":
          description: Recent quote bundles
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DailyQuote"

  /trades/{id}/ai-review:
    post:
      operationId: generateAiTradeReview
      tags: [aireview]
      summary: Generate (or fetch cached) AI review for a trade
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
        - name: force
          in: query
          required: false
          schema: { type: boolean }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                userKey: { type: ["string", "null"] }
                force: { type: ["boolean", "null"] }
      responses:
        "201":
          description: Review generated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiTradeReview"
        "404":
          description: Trade not found
        "429":
          description: Rate limited
    get:
      operationId: getAiTradeReview
      tags: [aireview]
      summary: Get the latest AI review for a trade (no generation)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Latest review
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiTradeReview"
        "404":
          description: No review yet

  /market-conditions/dna:
    get:
      operationId: getMarketConditionsDna
      tags: [insights]
      summary: Aggregated DNA of trade outcomes by market conditions
      parameters:
        - in: query
          name: userKey
          required: false
          schema:
            type: string
          description: Trader name to scope the DNA to a single user
      responses:
        "200":
          description: DNA breakdown
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MarketDna"

  # ── EMOTIONAL STATE ───────────────────────────────────────────────────────
  /emotional-state:
    get:
      operationId: getEmotionalStateHistory
      tags: [psychology]
      summary: Get emotional state history for a user
      parameters:
        - name: userId
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Emotional state log entries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/EmotionalStateLog"
    post:
      operationId: createEmotionalState
      tags: [psychology]
      summary: Submit today's check-in
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateEmotionalStateBody"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmotionalStateLog"

  /emotional-state/today:
    get:
      operationId: getTodayEmotionalState
      tags: [psychology]
      summary: Get today's emotional check-in for a user
      parameters:
        - name: userId
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Today's check-in or null
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/EmotionalStateLog"
                  - type: "null"

  # ── PSYCHOLOGY ANALYTICS ─────────────────────────────────────────────────
  /analytics/psychology:
    get:
      operationId: getPsychologyAnalytics
      tags: [psychology]
      summary: Psychology analytics aggregates scoped to a specific trader
      parameters:
        - name: userId
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Psychology analytics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PsychologyAnalytics"

  /voice-notes:
    get:
      operationId: listVoiceNotes
      tags: [psychology]
      summary: List voice notes for a user (scoped to owner; optionally filtered by trade or daily feed)
      parameters:
        - name: userId
          in: query
          required: true
          schema:
            type: string
        - name: tradeId
          in: query
          schema:
            type: integer
        - name: dailyFeedId
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: List of voice notes belonging to the specified user
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/VoiceNote"
        "400":
          description: userId is required
    post:
      operationId: createVoiceNote
      tags: [psychology]
      summary: Upload an audio file, transcribe it, and create a voice note
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [audio, userId]
              properties:
                audio:
                  type: string
                  format: binary
                userId:
                  type: string
                tradeId:
                  type: integer
                dailyFeedId:
                  type: integer
                durationSec:
                  type: integer
      responses:
        "201":
          description: Voice note created with transcript
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VoiceNote"
        "400":
          description: No audio file provided

  /voice-notes/{id}:
    delete:
      operationId: deleteVoiceNote
      tags: [psychology]
      summary: Delete a voice note (owner only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: userId
          in: query
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Deleted
        "400":
          description: userId is required
        "403":
          description: Not authorized
        "404":
          description: Not found

